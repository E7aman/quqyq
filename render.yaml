# Render Blueprint: один Docker-сервис (сайт + API + WebSocket) и Postgres.
databases:
  - name: quqyq-db
    plan: free            # бесплатная база живёт 30 дней с момента создания
    databaseName: quqyq
    user: quqyq

services:
  - type: web
    name: quqyq-ai
    runtime: docker
    plan: free            # засыпает после 15 минут без трафика
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: quqyq-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false       # впишите в панели Render, в git не попадает
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash
      - key: RATE_LIMIT_PER_MIN
        value: "20"
